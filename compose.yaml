services:
  backend:
    build: ./backend
    # Forward the complete shared configuration, including runner/debug/context flags.
    env_file:
      - .env.local
    environment:
      MASTER_SECRET: ${MASTER_SECRET:?Run make init-dev and configure .env.local}
      # JSON array parsed and validated by Settings/Fernet at backend startup.
      MASTER_SECRET_PREVIOUS: ${MASTER_SECRET_PREVIOUS:-[]}
      DATABASE_PATH: /app/data/app.sqlite3
      # Preserve `make up LLM_PROVIDER=fake` without duplicating settings defaults.
      LLM_PROVIDER: ${LLM_PROVIDER:-codex}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3002}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  backend-data:
