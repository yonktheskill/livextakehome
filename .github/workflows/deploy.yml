name: Deploy to Railway
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT: 3a12efd2-c496-4e46-85d4-162a8dcc7ac1
      RAILWAY_ENVIRONMENT: 0662e4db-04f1-4293-bfae-3bc8a8e00af9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @railway/cli@5.71.0
      - name: Deploy backend
        run: railway up backend --path-as-root --service backend --project "$RAILWAY_PROJECT" --environment "$RAILWAY_ENVIRONMENT" --ci
      - name: Deploy frontend
        run: railway up frontend --path-as-root --service frontend --project "$RAILWAY_PROJECT" --environment "$RAILWAY_ENVIRONMENT" --ci
      - name: Verify public health
        run: curl --fail --retry 24 --retry-all-errors --retry-delay 5 https://livex.hongxu.dev/api/health
