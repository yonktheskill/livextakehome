name: Provision private Codex login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @railway/cli@5.71.0
      - name: Stage temporary runtime login secret
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CODEX_LOGIN: ${{ secrets.CODEX_LOGIN_BOOTSTRAP }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEX_LOGIN"
          printf '%s' "$CODEX_LOGIN" | railway variable set --project 3a12efd2-c496-4e46-85d4-162a8dcc7ac1 --environment production --service backend --skip-deploys --stdin CODEX_LOGIN_BOOTSTRAP
