name: Provision private Codex login
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global @railway/cli@5.71.0
      - name: Upload login directly to private volume
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          CODEX_LOGIN: ${{ secrets.CODEX_LOGIN_BOOTSTRAP }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CODEX_LOGIN"
          umask 077
          login_dir="$(mktemp -d)"
          trap 'rm -rf "$login_dir"' EXIT
          printf '%s' "$CODEX_LOGIN" > "$login_dir/auth.json"
          unset CODEX_LOGIN
          railway volume files --volume 3a46da21-1810-41a5-bc17-896718225182 upload "$login_dir/auth.json" /codex/auth.json
